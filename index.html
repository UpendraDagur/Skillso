<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skillso</title>
  <link rel="icon" type="image/jpeg" href="favicon.jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    /* Root colors */
    :root {
      --yellow: #ffdf00;
      --black: #101010;
      --gray-light: #eaeaea;
      --white: #fff;
      --green: #25D366;
      --green-dark: #128C7E;
    }

    /* Global Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', system-ui, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--white);
      color: var(--black);
      line-height: 1.5;
    }

    /* Header */
    .header-wrapper { width: 100%; border-bottom: 1px solid rgba(0,0,0,0.1); background: var(--white); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1150px;
      margin: auto;
      padding: 20px;
      height: 74px;
    }
    .logo img { width: 42px; height: 42px; border-radius: 6px; cursor: pointer; }

    nav { display: flex; align-items: center; gap: 18px; }
    nav a {
      text-decoration: none;
      color: var(--black);
      font-weight: 500;
      font-size: 1rem;
      position: relative;
    }
    nav a:not(.cta)::after {
      content: "";
      position: absolute;
      left: 0; bottom: 0;
      height: 2px;
      width: 0;
      background: var(--yellow);
      transition: width 0.3s ease;
    }
    nav a:not(.cta):hover::after { width: 100%; }
    .cta {
      background: var(--black);
      color: var(--white);
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .cta:hover { background: #333; }

    /* Hamburger Menu */
    .menu-toggle { display: none; flex-direction: column; gap: 6px; cursor: pointer; width: 28px; height: 10px; }
    .menu-toggle span { display: block; height: 3px; background: var(--black); border-radius: 2px; transition: 0.4s ease; transform-origin: center center; }
    .menu-toggle span:first-child { width: 100%; }
    .menu-toggle span:last-child { width: 140%; margin-left: -40%; }
    .menu-toggle.active span:first-child { transform: rotate(45deg) translate(1px,5px); width:100%; margin-left:0; }
    .menu-toggle.active span:last-child { transform: rotate(-45deg) translate(-0.4px,-6px); width:100%; margin-left:0; }

    @media (max-width: 768px) {
      nav { display: none; position: absolute; top: 100%; right: 0; flex-direction: column; align-items: center; background: var(--white); width: 100%; padding: 20px 0; border-bottom: 1px solid rgba(0,0,0,0.1); }
      nav.active { display: flex; }
      .menu-toggle { display: flex; }
    }

    /* Purchase Section */
    .purchase-section {
      min-height: calc(100vh - 74px);
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: linear-gradient(to right, var(--gray-light) 1px, transparent 1px),
                        linear-gradient(to bottom, var(--gray-light) 1px, transparent 1px);
      background-size: 32px 32px;
      padding: 40px 20px;
    }
    .purchase-container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    .purchase-container h1 { font-size: 1.8rem; margin-bottom: 25px; font-weight: 700; }
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      appearance: none;
    }
    #priceDisplay { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 1.1rem; margin-bottom: 20px; }
    #priceDisplay .original { text-decoration: line-through; color: #999; }
    #priceDisplay .offer { color: var(--green); font-weight: 600; }
    .cta-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--green);
      color: #fff;
      box-shadow: 4px 4px 0 var(--green-dark);
      transition: all 0.1s ease;
    }
    .cta-btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }

    @media (max-width: 480px) {
      .purchase-section { padding: 30px 15px; }
      .purchase-container { padding: 20px; }
      .purchase-container h1 { font-size: 1.5rem; }
      .cta-btn { font-size: 1rem; padding: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-wrapper">
    <header>
      <div class="logo"><a href="#"><img src="logo.png" alt="Skillso Logo"></a></div>
      <nav id="nav-menu">
        <a href="">Courses</a>
        <a class="cta" href="">Login</a>
      </nav>
      <div class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" role="button" tabindex="0">
        <span></span>
        <span></span>
      </div>
    </header>
  </div>

  <!-- Purchase Course Section -->
  <section class="purchase-section" id="courses">
    <div class="purchase-container">
      <h1>Purchase Your Skillso Course</h1>
      <form id="purchaseForm">
        <select id="course" required>
          <option value="">Select Course</option>
          <option value="109" data-original="199">Spark (₹109)</option>
          <option value="319" data-original="399">Grow (₹319)</option>
          <option value="529" data-original="699">Wealth (₹529)</option>
          <option value="839" data-original="1099">Legacy (₹839)</option>
        </select>
        <div id="priceDisplay"></div>
        <button type="submit" class="cta-btn">Buy Now</button>
      </form>
    </div>
  </section>

  <script>
    // Hamburger Menu
    const toggleBtn = document.getElementById('menu-toggle');
    const navMenu = document.getElementById('nav-menu');

    toggleBtn.addEventListener('click', () => {
      navMenu.classList.toggle('active');
      toggleBtn.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!navMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
        navMenu.classList.remove('active');
        toggleBtn.classList.remove('active');
      }
    });

    toggleBtn.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        navMenu.classList.toggle('active');
        toggleBtn.classList.toggle('active');
      }
    });

    // Purchase Form Script
    const courseSelect = document.getElementById("course");
    const priceDisplay = document.getElementById("priceDisplay");

    courseSelect.addEventListener("change", function() {
      const selectedOption = courseSelect.options[courseSelect.selectedIndex];
      const offerPrice = selectedOption.value;
      const originalPrice = selectedOption.getAttribute("data-original");

      if (offerPrice) {
        priceDisplay.innerHTML = `
          <span class="original">Original Price: ₹${originalPrice}</span>
          <span class="offer">Offer Price: ₹${offerPrice}</span>
        `;
      } else {
        priceDisplay.innerHTML = '';
      }
    });

    document.getElementById("purchaseForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const price = courseSelect.value;
      if (!price) { alert("Please select a course."); return; }
      const upiURL = `upi://pay?pa=9012775446@fam&pn=Upendra%20Singh%20Dagur&am=${price}&cu=INR`;
      window.location.href = upiURL;
    });
  </script>

</body>
</html>
